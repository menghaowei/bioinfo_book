<text x='190' y='282' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>SAM</text>
<rect x='80' y='352' width='220' height='40' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='190' y='378' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>BAM（排序+索引）</text>
