<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 300' role='img' aria-labelledby='t d'>
<title id='t'>从 FASTQ 到 SAM 的技术路线</title>
<desc id='d'>FASTQ 经质控得到 clean reads，借助参考基因组索引比对得到 SAM，再转换为排序索引的 BAM 供检查与下游分析。</desc>
<rect x='60' y='100' width='110' height='44' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='115' y='120' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>FASTQ</text>
<text x='115' y='136' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>原始测序数据</text>
<rect x='210' y='100' width='110' height='44' rx='3' fill='none' stroke='#9ca3af' stroke-width='1.2'/>
<text x='265' y='120' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#333333' font-weight='bold' text-anchor='middle'>质控</text>
<text x='265' y='136' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>FastQC / cutadapt</text>
<rect x='360' y='100' width='110' height='44' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='415' y='120' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>clean reads</text>
<text x='415' y='136' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>质控后的数据</text>
<rect x='510' y='100' width='110' height='44' rx='3' fill='none' stroke='#9ca3af' stroke-width='1.2'/>
<text x='565' y='120' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#333333' font-weight='bold' text-anchor='middle'>比对</text>
<text x='565' y='136' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>bowtie2 / bwa + 索引</text>
<rect x='640' y='100' width='110' height='44' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='695' y='120' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>SAM</text>
<text x='695' y='136' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>比对结果</text>
<rect x='60' y='200' width='110' height='44' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='115' y='220' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>BAM</text>
