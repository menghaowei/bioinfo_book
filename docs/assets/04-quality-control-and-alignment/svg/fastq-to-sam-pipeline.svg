<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 860' role='img' aria-labelledby='t d'>
<title id='t'>从 FASTQ 到 SAM/BAM 的技术路线（竖版）</title>
<desc id='d'>FASTQ 经质控得到 clean reads，借助索引比对得到 SAM，再转换为排序索引的 BAM，经检查后进入下游分析。</desc>
<text x='280' y='40' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='middle'>从 FASTQ 到比对结果</text>
<rect x='130' y='66' width='300' height='52' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='280' y='88' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>FASTQ</text>
<text x='280' y='106' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>原始测序数据</text>
<rect x='130' y='160' width='300' height='52' rx='3' fill='none' stroke='#9ca3af' stroke-width='1.2'/>
<text x='280' y='182' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#333333' font-weight='bold' text-anchor='middle'>质控</text>
<text x='280' y='200' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>FastQC / cutadapt</text>
<rect x='130' y='254' width='300' height='52' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='280' y='276' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>clean reads</text>
<text x='280' y='294' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>质控后的数据</text>
<rect x='130' y='348' width='300' height='52' rx='3' fill='none' stroke='#9ca3af' stroke-width='1.2'/>
<text x='280' y='370' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='16' fill='#333333' font-weight='bold' text-anchor='middle'>比对</text>
<text x='280' y='388' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>bowtie2 / bwa + 索引</text>
<rect x='130' y='442' width='300' height='52' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='280' y='464' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>SAM</text>
<text x='280' y='482' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='middle'>比对结果</text>
