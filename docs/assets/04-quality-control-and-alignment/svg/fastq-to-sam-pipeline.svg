<svg xmlns='http://www.w3.org/2000/svg' width='430' height='600' viewBox='0 0 430 600' role='img' aria-labelledby='t d'>
<title id='t'>从 FASTQ 到排序索引 BAM 的技术路线（竖版）</title>
<desc id='d'>主线为数据：FASTQ 经质控得到 clean reads，比对得到 SAM，排序索引得到 BAM；每步操作与所用软件标注在箭头旁。</desc>
<text x='150' y='36' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='middle'>从测序数据到排序索引的 BAM</text>
<rect x='30' y='64' width='240' height='40' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='150' y='90' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>FASTQ</text>
<rect x='30' y='154' width='240' height='40' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='150' y='180' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>clean reads</text>
<rect x='30' y='244' width='240' height='40' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='150' y='270' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>SAM</text>
<rect x='30' y='334' width='240' height='40' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='150' y='360' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>BAM（排序+索引）</text>
<line x1='150' y1='108' x2='150' y2='150' stroke='#186254' stroke-width='1.6'/>
<line x1='150.0' y1='150.0' x2='153.9' y2='141.9' stroke='#186254' stroke-width='1.6'/>
<line x1='150.0' y1='150.0' x2='146.1' y2='141.9' stroke='#186254' stroke-width='1.6'/>
<text x='164' y='124' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#333333' font-weight='bold' text-anchor='start'>质控</text>
<text x='164' y='142' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>FastQC / cutadapt</text>
<line x1='150' y1='198' x2='150' y2='240' stroke='#186254' stroke-width='1.6'/>
<line x1='150.0' y1='240.0' x2='153.9' y2='231.9' stroke='#186254' stroke-width='1.6'/>
<line x1='150.0' y1='240.0' x2='146.1' y2='231.9' stroke='#186254' stroke-width='1.6'/>
<text x='164' y='214' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#333333' font-weight='bold' text-anchor='start'>回贴比对</text>
<text x='164' y='232' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>Bowtie 2 / BWA + 索引</text>
<line x1='150' y1='288' x2='150' y2='330' stroke='#186254' stroke-width='1.6'/>
<line x1='150.0' y1='330.0' x2='153.9' y2='321.9' stroke='#186254' stroke-width='1.6'/>
<line x1='150.0' y1='330.0' x2='146.1' y2='321.9' stroke='#186254' stroke-width='1.6'/>
