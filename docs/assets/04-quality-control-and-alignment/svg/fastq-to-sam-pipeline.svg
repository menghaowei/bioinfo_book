<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 620' role='img' aria-labelledby='t d'>
<title id='t'>从 FASTQ 到排序索引 BAM 的技术路线（竖版）</title>
<desc id='d'>主线为数据：FASTQ 经质控得到 clean reads，比对得到 SAM，排序索引得到 BAM；每步操作与所用软件标注在箭头旁。</desc>
<text x='190' y='36' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='middle'>从测序数据到排序索引的 BAM</text>
