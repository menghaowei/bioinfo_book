<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 620 260' role='img' aria-labelledby='t d'>
<title id='t'>碱基的四进制编码</title>
<desc id='d'>把 A、T、G、C 分别编码为 0、1、3、2，按最左位权值最高计算，ATGCT 的关键码为 121。</desc>
<text x='90' y='40' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='start'>把碱基编码成数字：A→0，T→1，G→3，C→2</text>
<rect x='78' y='52' width='44' height='46' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='100' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='20' fill='#333333' font-weight='bold' text-anchor='start'>A</text>
<text x='100' y='100' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='start'>0</text>
<text x='94' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>4⁴</text>
<rect x='142' y='52' width='44' height='46' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='164' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='20' fill='#333333' font-weight='bold' text-anchor='start'>T</text>
<text x='164' y='100' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='start'>1</text>
<text x='158' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>4³</text>
<rect x='206' y='52' width='44' height='46' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='228' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='20' fill='#333333' font-weight='bold' text-anchor='start'>G</text>
<text x='228' y='100' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='start'>3</text>
<text x='222' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>4²</text>
<rect x='270' y='52' width='44' height='46' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='292' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='20' fill='#333333' font-weight='bold' text-anchor='start'>C</text>
<text x='292' y='100' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='start'>2</text>
<text x='286' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>4¹</text>
<rect x='334' y='52' width='44' height='46' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='356' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='20' fill='#333333' font-weight='bold' text-anchor='start'>T</text>
<text x='356' y='100' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='start'>1</text>
<text x='350' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>4⁰</text>
<line x1='80' y1='140' x2='390' y2='140' stroke='#9ca3af' stroke-width='1.2'/>
<text x='60' y='174' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>H(ATGCT) = 0×4⁴ + 1×4³ + 3×4² + 2×4¹ + 1×4⁰ = 0 + 64 + 48 + 8 + 1 = </text>
<text x='570' y='174' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#186254' font-weight='bold' text-anchor='start'>121</text>
<text x='60' y='204' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>最左边的碱基权值最高（4⁴），最右边的碱基权值最低（4⁰）。</text>
</svg>
