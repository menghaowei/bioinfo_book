<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 280' role='img' aria-labelledby='t d'>
<title id='t'>碱基的四进制编码</title>
<desc id='d'>把 A、T、G、C 分别编码为 0、1、3、2，按最左位权值最高计算，ATGCT 的关键码为 121。</desc>
<text x='90' y='42' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='start'>把碱基编码成数字：A→0，T→1，G→3，C→2</text>
<rect x='76' y='54' width='56' height='52' rx='3' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='104' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='bold' text-anchor='middle'>A</text>
<text x='104' y='102' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>0</text>
<text x='104' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='middle'>4⁴</text>
<rect x='176' y='54' width='56' height='52' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='204' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='bold' text-anchor='middle'>T</text>
<text x='204' y='102' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>1</text>
<text x='204' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='middle'>4³</text>
<rect x='276' y='54' width='56' height='52' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='304' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='bold' text-anchor='middle'>G</text>
<text x='304' y='102' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>3</text>
<text x='304' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='middle'>4²</text>
<rect x='376' y='54' width='56' height='52' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='404' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='bold' text-anchor='middle'>C</text>
<text x='404' y='102' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>2</text>
<text x='404' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='middle'>4¹</text>
<rect x='476' y='54' width='56' height='52' rx='3' fill='none' stroke='#186254' stroke-width='1.2'/>
<text x='504' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='bold' text-anchor='middle'>T</text>
<text x='504' y='102' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='16' fill='#186254' font-weight='bold' text-anchor='middle'>1</text>
<text x='504' y='126' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='middle'>4⁰</text>
<line x1='70' y1='140' x2='560' y2='140' stroke='#9ca3af' stroke-width='1.2'/>
<text x='70' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>H(ATGCT) =</text>
<text x='180' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>0×256 +</text>
<text x='264' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>1×64 +</text>
<text x='348' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>3×16 +</text>
<text x='432' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>2×4 +</text>
<text x='516' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>1×1</text>
<text x='590' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>=</text>
<text x='614' y='178' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='20' fill='#186254' font-weight='bold' text-anchor='start'>121</text>
<text x='70' y='208' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>最左边的碱基权值最高（4⁴），最右边的碱基权值最低（4⁰）。</text>
</svg>
