<text x='24' y='348' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>外显子（exon）：出现在成熟 RNA 中；内含子（intron）：转录后被剪接移除。</text>
<text x='24' y='370' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>全部外显子的集合即外显子组（exome），是 WES 捕获测序的目标区域。</text>
