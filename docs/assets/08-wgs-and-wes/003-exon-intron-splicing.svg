<svg xmlns='http://www.w3.org/2000/svg' width='780' height='380' viewBox='0 0 780 380' role='img' aria-labelledby='t d'>
<title id='t'>外显子、内含子与剪接的关系示意</title>
<desc id='d'>上：DNA 上的基因结构，外显子为方块、内含子为折线段；中：转录得到的 pre-mRNA 仍含内含子；下：剪接移除内含子、外显子相连并加上 5' 帽与 poly(A) 尾，形成成熟 mRNA。</desc>
