<svg xmlns='http://www.w3.org/2000/svg' width='940' height='560' viewBox='0 0 940 560'>
<title>三字母比对原理</title>
<desc>Bismark 把参考基因组分别转换为 C→T 与 G→A 两套三字母基因组；reads 同方向转换后进入 bowtie2 比对，再映射回原坐标，避开了成串假错配。</desc>
<text x='30' y='34' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='start'>困难：reads 带成串系统性 C→T 错配，四字母直接比对会把它们当真错配</text>
<text x='60' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>C</text>
<line x1='66' y1='82' x2='66' y2='94' stroke='#9ca3af' stroke-width='0.8' stroke-dasharray='2,3'/>
<rect x='54' y='92' width='28' height='24' rx='3' fill='#fdf3e3' stroke='#b45309' stroke-width='1.1'/>
<text x='60' y='108' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#b45309' font-weight='normal' text-anchor='start'>T</text>
<text x='100' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>T</text>
<line x1='106' y1='82' x2='106' y2='94' stroke='#9ca3af' stroke-width='0.8' stroke-dasharray='2,3'/>
<text x='100' y='108' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>T</text>
<text x='140' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>C</text>
<line x1='146' y1='82' x2='146' y2='94' stroke='#9ca3af' stroke-width='0.8' stroke-dasharray='2,3'/>
<rect x='134' y='92' width='28' height='24' rx='3' fill='#fdf3e3' stroke='#b45309' stroke-width='1.1'/>
<text x='140' y='108' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#b45309' font-weight='normal' text-anchor='start'>T</text>
<text x='180' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>A</text>
<line x1='186' y1='82' x2='186' y2='94' stroke='#9ca3af' stroke-width='0.8' stroke-dasharray='2,3'/>
<text x='180' y='108' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>A</text>
<text x='220' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>G</text>
<line x1='226' y1='82' x2='226' y2='94' stroke='#9ca3af' stroke-width='0.8' stroke-dasharray='2,3'/>
<text x='220' y='108' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>G</text>
<text x='260' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>T</text>
<line x1='266' y1='82' x2='266' y2='94' stroke='#9ca3af' stroke-width='0.8' stroke-dasharray='2,3'/>
<text x='260' y='108' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>T</text>
<text x='300' y='74' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>C</text>
<line x1='306' y1='82' x2='306' y2='94' stroke='#9ca3af' stroke-width='0.8' stroke-dasharray='2,3'/>
<rect x='294' y='92' width='28' height='24' rx='3' fill='#fdf3e3' stroke='#b45309' stroke-width='1.1'/>
<text x='300' y='108' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#b45309' font-weight='normal' text-anchor='start'>T</text>
<text x='60' y='138' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#b45309' font-weight='normal' text-anchor='start'>wild-type 参考：错配多 → 比对丢失或错位</text>
<line x1='30' y1='158' x2='910' y2='158' stroke='#9ca3af' stroke-width='1'/>
<text x='30' y='188' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='start'>Bismark 的做法：把问题搬到“三字母世界”</text>
<text x='60' y='226' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>参考基因组</text>
<text x='180' y='226' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>CTCAGTC</text>
<line x1='150' y1='236' x2='150' y2='262' stroke='#186254' stroke-width='1.4'/>
<line x1='150.0' y1='262.0' x2='153.9' y2='253.9' stroke='#186254' stroke-width='1.4'/>
<line x1='150.0' y1='262.0' x2='146.1' y2='253.9' stroke='#186254' stroke-width='1.4'/>
<text x='60' y='274' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#186254' font-weight='normal' text-anchor='start'>C→T 转换组</text>
<text x='180' y='274' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#186254' font-weight='normal' text-anchor='start'>TTTAGTT</text>
<text x='320' y='274' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>（OT：reads 原链 C→T 后比对）</text>
<text x='60' y='306' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#186254' font-weight='normal' text-anchor='start'>G→A 转换组</text>
<text x='180' y='306' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#186254' font-weight='normal' text-anchor='start'>CTCAATC</text>
<text x='320' y='306' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>（OB：reads 互补 G→A 后比对）</text>
<text x='60' y='356' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>reads（OT 方向）</text>
<text x='180' y='356' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>TTTAGTT</text>
<line x1='340' y1='350' x2='420' y2='350' stroke='#186254' stroke-width='1.4'/>
<line x1='420.0' y1='350.0' x2='411.9' y2='346.1' stroke='#186254' stroke-width='1.4'/>
<line x1='420.0' y1='350.0' x2='411.9' y2='353.9' stroke='#186254' stroke-width='1.4'/>
<text x='440' y='356' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#186254' font-weight='normal' text-anchor='start'>与 C→T 组完全匹配（错配消失）</text>
<text x='60' y='396' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>reads（OB 方向）</text>
<text x='180' y='396' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='18' fill='#333333' font-weight='normal' text-anchor='start'>AAATCAA</text>
<line x1='340' y1='390' x2='420' y2='390' stroke='#186254' stroke-width='1.4'/>
<line x1='420.0' y1='390.0' x2='411.9' y2='386.1' stroke='#186254' stroke-width='1.4'/>
<line x1='420.0' y1='390.0' x2='411.9' y2='393.9' stroke='#186254' stroke-width='1.4'/>
<text x='440' y='396' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#186254' font-weight='normal' text-anchor='start'>G→A 后与 G→A 组比对</text>
<rect x='30' y='430' width='880' height='108' rx='8' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='50' y='460' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>比对发生在三字母世界，甲基化判读发生在四碱基世界：</text>
<text x='50' y='486' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>比对完成后，Bismark 把 reads 映射回原始参考坐标，逐碱基重新比对 C（或 G）位置，</text>
<text x='50' y='508' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>生成 XM 标签：该位点是 CpG/CHG/CHH 语境、甲基化（Z/X/H）还是未甲基化（z/x/h）。</text>
<text x='50' y='530' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>方向性文库（OT/OB）只需跑两组；非方向性文库才需要 CTOT/CTOB 全部四组比对。</text>
</svg>
