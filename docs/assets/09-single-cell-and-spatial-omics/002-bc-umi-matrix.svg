<svg xmlns='http://www.w3.org/2000/svg' width='900' height='430' viewBox='0 0 900 430' role='img' aria-labelledby='t d'>
<title id='t'>barcode、UMI 与计数矩阵的对应关系</title>
<desc id='d'>三条 read 带相同细胞 barcode AACGTACGTA；前两条 UMI 相同（TTAGGC），是同一 mRNA 分子的 PCR 重复，去重后只计 1 个分子并归属到 Gene1；第三条 UMI 不同（CCGATA），是另一个分子，归属到 Gene2。右下计数矩阵中高亮列即该细胞，数字为 UMI 分子数（示意，未按实际长度绘制）。</desc>
<text x='48' y='54' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#186254' font-weight='bold' text-anchor='start'>测序得到的 read（同一细胞 barcode）</text>
