<text x='60' y='360' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>矩阵里一个数字的含义：这个细胞里，这个基因被捕获并计数到几个 UMI 分子（去重后）。</text>
