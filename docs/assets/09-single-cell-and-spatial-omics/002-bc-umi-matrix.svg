<title id='t'>barcode、UMI 与计数矩阵的对应关系</title>
<desc id='d'>三条 read 带相同细胞 barcode AACGTACGTA；前两条 UMI 相同（TTAGGC），是同一 mRNA 分子的 PCR 重复，按 UMI 去重只计 1 个分子并归属 Gene1；第三条 UMI 不同（CCGATA），是另一个分子，归属 Gene2。右侧计数矩阵高亮列即该细胞，数字为 UMI 分子数。示意，未按实际长度绘制。</desc>
