<title id='t'>ceRNA：多种 RNA 竞争结合 miRNA</title>
<desc id='d'>mRNA、lncRNA、circRNA 都携带 miRNA 结合位点，像海绵一样竞争结合同一批 miRNA，间接影响彼此的翻译抑制强度。</desc>
