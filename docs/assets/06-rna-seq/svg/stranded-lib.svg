<text x='221.0' y='95.32' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>合成（dTTP）</text>
<rect x='318' y='60' width='126' height='44' rx='6' fill='#fdf3e3' stroke='#186254' stroke-width='1.2'/>
<text x='381.0' y='77.32' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>第二链 cDNA</text>
<text x='381.0' y='95.32' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>掺入 dUTP</text>
<circle cx='334' cy='100' r='3' fill='#b45309'/>
