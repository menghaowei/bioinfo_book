<text x="500" y="49" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="29" font-weight="600" fill="#186254">远端服务器</text>
<text x="140" y="93" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="24" font-weight="400" fill="#333333">按需选择系统</text>
