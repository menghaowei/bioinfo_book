<svg xmlns='http://www.w3.org/2000/svg' width='900' height='430' viewBox='0 0 900 430'>
<title>GLORI 化学原理</title>
<desc>乙二醛保护 m6A 与 G；亚硝酸盐把未修饰 A 脱氨为 I（读作 G）；m6A 位点在 reads 中残留 A，A/(A+G) 即修饰比例。</desc>
<text x='30' y='34' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='15' fill='#333333' font-weight='bold' text-anchor='start'>mRNA 片段（转录本局部序列）</text>
<rect x='400' y='56' width='34' height='30' rx='4' fill='#fdf3e3' stroke='#b45309' stroke-width='1.2'/>
<text x='60' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>G</text>
<text x='118' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>A</text>
<text x='176' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>C</text>
<text x='234' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>U</text>
<text x='292' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>A</text>
<text x='350' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>G</text>
<text x='408' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#b45309' font-weight='bold' text-anchor='start'>A</text>
<text x='466' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>C</text>
<text x='524' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>U</text>
<text x='582' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>A</text>
<text x='640' y='78' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>A</text>
<text x='448' y='58' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#b45309' font-weight='normal' text-anchor='start'>m6A（DRACH 基序中的 A）</text>
<line x1='430' y1='108' x2='430' y2='148' stroke='#186254' stroke-width='1.8'/>
<line x1='430.0' y1='148.0' x2='433.9' y2='139.9' stroke='#186254' stroke-width='1.8'/>
<line x1='430.0' y1='148.0' x2='426.1' y2='139.9' stroke='#186254' stroke-width='1.8'/>
<text x='448' y='118' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#186254' font-weight='normal' text-anchor='start'>① 乙二醛：保护 m6A 与 G</text>
<text x='448' y='140' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#186254' font-weight='normal' text-anchor='start'>② 亚硝酸盐：未修饰 A 脱氨为 I</text>
<text x='30' y='196' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#333333' font-weight='normal' text-anchor='start'>GLORI 处理 + 逆转录 + 测序后，reads 显示为：</text>
<text x='60' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>G</text>
<rect x='110' y='218' width='34' height='30' rx='4' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='118' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#186254' font-weight='bold' text-anchor='start'>G</text>
<text x='176' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>C</text>
<text x='234' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>U</text>
<rect x='284' y='218' width='34' height='30' rx='4' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='292' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#186254' font-weight='bold' text-anchor='start'>G</text>
<text x='350' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>G</text>
<rect x='400' y='218' width='34' height='30' rx='4' fill='#fdf3e3' stroke='#b45309' stroke-width='1.2'/>
<text x='408' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#b45309' font-weight='bold' text-anchor='start'>A</text>
<text x='466' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>C</text>
<text x='524' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#333333' font-weight='normal' text-anchor='start'>U</text>
<rect x='574' y='218' width='34' height='30' rx='4' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='582' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#186254' font-weight='bold' text-anchor='start'>G</text>
<rect x='632' y='218' width='34' height='30' rx='4' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='640' y='240' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='22' fill='#186254' font-weight='bold' text-anchor='start'>G</text>
<text x='292' y='274' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#186254' font-weight='normal' text-anchor='start'>未修饰 A → 读作 G（~98% 转化）</text>
<text x='368' y='296' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#b45309' font-weight='normal' text-anchor='start'>m6A → 仍读 A</text>
<rect x='30' y='320' width='840' height='84' rx='8' fill='#e8f4f1' stroke='#186254' stroke-width='1.2'/>
<text x='50' y='350' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>位点修饰比例（化学计量）≈ 该位点 reads 中 A 占 (A + G) 的比例</text>
<text x='50' y='380' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>与亚硫酸盐读 5mC 同构：把未修饰碱基化学改写掉，让修饰碱基留下来，从错配里读出比例。</text>
<text x='50' y='398' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#b45309' font-weight='normal' text-anchor='start'>代价：脱氨不完全的 ~2% 构成假阳性下限；A/G SNP 会被误读为“被保护的 A”——见 8.5.3。</text>
</svg>
