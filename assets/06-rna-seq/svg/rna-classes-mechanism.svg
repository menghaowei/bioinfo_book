<title id='t'>RNA 的主要类型与分工</title>
<desc id='d'>核内 DNA 转录产生 RNA，snRNA 参与剪接；mRNA 进入细胞质，在含 rRNA 的核糖体上由 tRNA 配合翻译；miRNA、siRNA、lncRNA 与 circRNA 以不同方式参与调控。所画为代表性形态和作用场景。</desc>
