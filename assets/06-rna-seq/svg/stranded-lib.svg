<svg xmlns='http://www.w3.org/2000/svg' width='700' height='310' viewBox='0 0 700 310' role='img' aria-labelledby='t d'>
<title id='t'>dUTP 链特异性建库流程示意图</title>
<desc id='d'>第一链 cDNA 正常合成；第二链以 dUTP 替代 dTTP；接头连接后 USER 酶特异降解含 dUTP 的第二链，只保留与原始 RNA 互补的第一链进入 PCR，read 与转录本链的对应关系因此确定。</desc>
<rect x='22' y='56' width='104' height='46' rx='6' fill='#f4faf8' stroke='#186254' stroke-width='1.2'/>
<text x='74.0' y='83.32' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>RNA 转录本</text>
<rect x='158' y='56' width='128' height='46' rx='6' fill='#f4faf8' stroke='#186254' stroke-width='1.2'/>
