<text x='222.0' y='92.32' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>合成（dTTP）</text>
<rect x='318' y='56' width='128' height='46' rx='6' fill='#fdf6ec' stroke='#b45309' stroke-width='1.2'/>
<text x='382.0' y='74.32' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>第二链 cDNA</text>
<text x='382.0' y='92.32' font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>掺入 dUTP</text>
<circle cx='334' cy='98' r='3.4' fill='#b45309'/>
