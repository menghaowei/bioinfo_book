<svg xmlns='http://www.w3.org/2000/svg' width='720' height='440' viewBox='0 0 720 440' role='img' aria-labelledby='t d'>
<title id='t'>细胞总 RNA 的主要类型与占比示意图</title>
<desc id='d'>上方占比条：rRNA 约 80–90%、tRNA 约 10–15%、其余（含 mRNA）约 3%；下方六张卡片绘制 mRNA、rRNA、tRNA、miRNA、lncRNA、circRNA 的代表性结构。</desc>
<rect x='60' y='40' width='476.0' height='26' rx='3' fill='#2f6e60' stroke='#ffffff' stroke-width='1.5'/>
<rect x='536.0' y='40' width='67.2' height='26' rx='3' fill='#7ab5a8' stroke='#ffffff' stroke-width='1.5'/>
<rect x='603.2' y='40' width='16.8' height='26' rx='3' fill='#b45309' stroke='#ffffff' stroke-width='1.5'/>
<text x='298.0' y='88' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='middle'>rRNA ≈ 80–90%</text>
<text x='569.6' y='88' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='end'>tRNA ≈ 10–15%</text>
<text x='620' y='30' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#b45309' font-weight='normal' text-anchor='end'>其他 ≈ 3%（含 mRNA）</text>
<text x='60' y='30' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#6b7280' font-weight='normal' text-anchor='start'>总 RNA 构成（数量级口径）</text>
<rect x='60' y='108' width='204' height='132' rx='10' fill='#f4faf8' stroke='#cfe3dd' stroke-width='1.2'/>
<text x='74' y='132' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>mRNA</text>
<circle cx='194' cy='142' r='7' fill='#186254'/>
<rect x='206' y='134' width='40' height='16' rx='3' fill='#186254' stroke='#186254' stroke-width='1.2'/>
<line x1='246' y1='142' x2='252' y2='142' stroke='#186254' stroke-width='3'/>
<text x='254' y='146' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='11' fill='#b45309' font-weight='normal' text-anchor='start'>A</text>
<text x='265' y='146' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='11' fill='#b45309' font-weight='normal' text-anchor='start'>A</text>
<text x='276' y='146' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='11' fill='#b45309' font-weight='normal' text-anchor='start'>A</text>
<text x='74' y='170' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>5′ 帽—编码区—poly(A) 尾</text>
<text x='74' y='192' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>编码蛋白，仅占百分之几</text>
<rect x='276' y='108' width='204' height='132' rx='10' fill='#f4faf8' stroke='#cfe3dd' stroke-width='1.2'/>
<text x='290' y='132' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>rRNA</text>
<ellipse cx='424' cy='136' rx='20' ry='11' fill='none' stroke='#186254' stroke-width='2.2'/>
<ellipse cx='436' cy='150' rx='20' ry='11' fill='none' stroke='#186254' stroke-width='2.2'/>
<text x='290' y='170' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>核糖体的结构骨架</text>
<text x='290' y='192' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>占绝对大头，建库要处理</text>
<rect x='492' y='108' width='204' height='132' rx='10' fill='#f4faf8' stroke='#cfe3dd' stroke-width='1.2'/>
<text x='506' y='132' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>tRNA</text>
<circle cx='634' cy='132' r='8' fill='none' stroke='#186254' stroke-width='2.2'/>
<circle cx='626' cy='146' r='8' fill='none' stroke='#186254' stroke-width='2.2'/>
<circle cx='642' cy='146' r='8' fill='none' stroke='#186254' stroke-width='2.2'/>
<line x1='634' y1='140' x2='634' y2='152' stroke='#186254' stroke-width='2.2'/>
<text x='631' y='162' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='9' fill='#186254' font-weight='normal' text-anchor='start'>3′</text>
<text x='506' y='170' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>三叶草二级结构</text>
<text x='506' y='192' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>转运氨基酸，含量第二</text>
<rect x='60' y='252' width='204' height='132' rx='10' fill='#f4faf8' stroke='#cfe3dd' stroke-width='1.2'/>
<text x='74' y='276' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>miRNA</text>
<path d='M 186 298 C 196 260 210 260 220 298' fill='none' stroke='#c9d6d1' stroke-width='2.4'/>
<path d='M 220 298 C 230 326 244 326 254 298' fill='none' stroke='#186254' stroke-width='2.6'/>
<text x='74' y='314' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>发卡前体 → 22 nt 成熟体</text>
<text x='74' y='336' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>小 RNA 调控，需专门文库</text>
<rect x='276' y='252' width='204' height='132' rx='10' fill='#f4faf8' stroke='#cfe3dd' stroke-width='1.2'/>
<text x='290' y='276' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>lncRNA</text>
<rect x='402' y='284' width='68' height='12' rx='6' fill='none' stroke='#186254' stroke-width='2.2'/>
<circle cx='420' cy='274' r='5' fill='#cfe3dd'/>
<circle cx='448' cy='274' r='5' fill='#cfe3dd'/>
<text x='290' y='314' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>长非编码 RNA（&gt;200 nt）</text>
<text x='290' y='336' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>调控多样，多无 poly(A) 尾</text>
<rect x='492' y='252' width='204' height='132' rx='10' fill='#f4faf8' stroke='#cfe3dd' stroke-width='1.2'/>
<text x='506' y='276' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#186254' font-weight='bold' text-anchor='start'>circRNA</text>
<circle cx='652' cy='290' r='16' fill='none' stroke='#186254' stroke-width='3'/>
<circle cx='652' cy='274' r='4.5' fill='#b45309'/>
<text x='506' y='314' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#333333' font-weight='normal' text-anchor='start'>反向剪接成环、无游离末端</text>
<text x='506' y='336' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='12' fill='#6b7280' font-weight='normal' text-anchor='start'>去 rRNA/去线性可测到</text>
<text x='360.0' y='430' font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size='13' fill='#333333' font-weight='bold' text-anchor='middle'>建库策略的选择，本质上就是决定“总 RNA 里的哪些部分进入文库”</text>
</svg>
