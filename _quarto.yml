project:
  type: book
  output-dir: docs
  resources:
    - assets/**
    - styles/book.css
  post-render:
    - python3 scripts/post_render.py

book:
  title: "在AI时代写给每一位的生信入门书"
  subtitle: "从理解数据，到独立分析"
  author: "生物信息学实战手册编写团队"
  language: zh-CN
  site-url: https://book.bioinfo.info/
  search: true
  page-navigation: true
  sidebar:
    title: "AI时代生信入门"
    style: docked
    collapse-level: 2
  page-footer:
    left: "© 2026 MENG Haowei 版权所有"
    right: "[版权与使用条款](https://book.bioinfo.info/license.html)"
  chapters:
    - index.qmd
    - manuscript/01-ai-era-introduction.md
    - manuscript/02-environment-and-programming.md
    - manuscript/03-sequencing-technologies.md
    - manuscript/04-sequence-alignment.md
    - manuscript/05-rna-seq.md
    - manuscript/06-chip-seq-and-atac-seq.md
    - manuscript/07-wgs-and-wes.md
    - manuscript/08-base-imbalanced-sequencing.md
    - manuscript/09-single-cell-and-spatial-omics.md
    - manuscript/10-snakemake-and-reproducibility.md
    - manuscript/11-statistics-and-learning.md
    - manuscript/12-ai-learning-and-practice.md
  appendices:
    - appendices/a-references-and-materials.md

lang: zh-CN
pandoc-args:
  - --data-dir=pandoc-data
format:
  html:
    theme: [cosmo, styles/book.scss]
    css: styles/book.css
    toc: true
    toc-title: 本章目录
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: scroll
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    html-math-method:
      method: mathjax
      url: ../vendor/mathjax/tex-chtml.js
    include-after-body: includes/reading.html
    grid:
      body-width: 830px
      sidebar-width: 480px
      margin-width: 530px

execute:
  enabled: false
  eval: false

crossref:
  fig-title: 图
  tbl-title: 表
  eq-prefix: 公式
  sec-prefix: 节
